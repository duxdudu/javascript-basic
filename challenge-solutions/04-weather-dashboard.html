<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    
    h1 {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      font-size: 2.5rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    
    .search-section {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    .search-box {
      display: flex;
      gap: 12px;
    }
    
    input {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1.05rem;
      outline: none;
      transition: border-color 0.2s;
    }
    
    input:focus {
      border-color: #667eea;
    }
    
    button {
      padding: 14px 28px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    button:hover {
      background: #5a67d8;
      transform: translateY(-2px);
    }
    
    button:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
      transform: none;
    }
    
    .weather-card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: none;
    }
    
    .weather-card.show {
      display: block;
    }
    
    .city-name {
      font-size: 2rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 8px;
    }
    
    .date-time {
      color: #718096;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }
    
    .weather-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 2px solid #e2e8f0;
    }
    
    .temperature {
      font-size: 4rem;
      font-weight: 700;
      color: #667eea;
    }
    
    .weather-icon {
      font-size: 5rem;
    }
    
    .weather-description {
      font-size: 1.3rem;
      color: #4a5568;
      text-transform: capitalize;
      margin-bottom: 24px;
    }
    
    .weather-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    
    .detail-item {
      background: #f7fafc;
      padding: 16px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .detail-icon {
      font-size: 1.8rem;
    }
    
    .detail-info {
      flex: 1;
    }
    
    .detail-label {
      font-size: 0.8rem;
      color: #718096;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    
    .detail-value {
      font-size: 1.2rem;
      font-weight: 600;
      color: #2d3748;
    }
    
    .error-message {
      background: #fed7d7;
      color: #c53030;
      padding: 16px;
      border-radius: 10px;
      margin-top: 16px;
      display: none;
    }
    
    .error-message.show {
      display: block;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
      font-size: 1.1rem;
      display: none;
    }
    
    .loading.show {
      display: block;
    }
    
    .api-note {
      background: #fef5e7;
      border-left: 4px solid #f39c12;
      padding: 16px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 0.9rem;
      color: #7d6608;
    }
    
    .api-note strong {
      display: block;
      margin-bottom: 8px;
      color: #f39c12;
    }
    
    @media (max-width: 600px) {
      .weather-main {
        flex-direction: column;
        text-align: center;
        gap: 16px;
      }
      
      .weather-details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🌤️ Weather Dashboard</h1>
    
    <div class="search-section">
      <div class="search-box">
        <input 
          type="text" 
          id="cityInput" 
          placeholder="Enter city name (e.g., London)"
        />
        <button id="searchBtn">Search</button>
      </div>
      
      <div class="api-note">
        <strong>⚠️ API Key Required</strong>
        To use this app, you need a free API key from 
        <a href="https://openweathermap.org/api" target="_blank">OpenWeatherMap</a>.
        Replace 'YOUR_API_KEY' in the JavaScript code with your actual key.
      </div>
      
      <div class="error-message" id="errorMessage"></div>
    </div>
    
    <div class="loading" id="loading">
      <div style="font-size:3rem; margin-bottom:12px;">⏳</div>
      Loading weather data...
    </div>
    
    <div class="weather-card" id="weatherCard">
      <div class="city-name" id="cityName"></div>
      <div class="date-time" id="dateTime"></div>
      
      <div class="weather-main">
        <div class="temperature" id="temperature"></div>
        <div class="weather-icon" id="weatherIcon"></div>
      </div>
      
      <div class="weather-description" id="description"></div>
      
      <div class="weather-details">
        <div class="detail-item">
          <div class="detail-icon">💧</div>
          <div class="detail-info">
            <div class="detail-label">Humidity</div>
            <div class="detail-value" id="humidity"></div>
          </div>
        </div>
        
        <div class="detail-item">
          <div class="detail-icon">💨</div>
          <div class="detail-info">
            <div class="detail-label">Wind Speed</div>
            <div class="detail-value" id="windSpeed"></div>
          </div>
        </div>
        
        <div class="detail-item">
          <div class="detail-icon">🌡️</div>
          <div class="detail-info">
            <div class="detail-label">Feels Like</div>
            <div class="detail-value" id="feelsLike"></div>
          </div>
        </div>
        
        <div class="detail-item">
          <div class="detail-icon">🔽</div>
          <div class="detail-info">
            <div class="detail-label">Pressure</div>
            <div class="detail-value" id="pressure"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ IMPORTANT: Replace with your actual API key from openweathermap.org
    const API_KEY = "YOUR_API_KEY_HERE";
    const API_URL = "https://api.openweathermap.org/data/2.5/weather";
    
    // DOM elements
    const cityInput = document.getElementById("cityInput");
    const searchBtn = document.getElementById("searchBtn");
    const loading = document.getElementById("loading");
    const errorMessage = document.getElementById("errorMessage");
    const weatherCard = document.getElementById("weatherCard");
    const cityName = document.getElementById("cityName");
    const dateTime = document.getElementById("dateTime");
    const temperature = document.getElementById("temperature");
    const weatherIcon = document.getElementById("weatherIcon");
    const description = document.getElementById("description");
    const humidity = document.getElementById("humidity");
    const windSpeed = document.getElementById("windSpeed");
    const feelsLike = document.getElementById("feelsLike");
    const pressure = document.getElementById("pressure");
    
    // Weather icon mapping
    const weatherIcons = {
      "01d": "☀️", "01n": "🌙",
      "02d": "⛅", "02n": "☁️",
      "03d": "☁️", "03n": "☁️",
      "04d": "☁️", "04n": "☁️",
      "09d": "🌧️", "09n": "🌧️",
      "10d": "🌦️", "10n": "🌧️",
      "11d": "⛈️", "11n": "⛈️",
      "13d": "❄️", "13n": "❄️",
      "50d": "🌫️", "50n": "🌫️"
    };
    
    // Load last searched city
    function loadLastCity() {
      const lastCity = localStorage.getItem("lastCity");
      if (lastCity) {
        cityInput.value = lastCity;
      }
    }
    
    // Save city to localStorage
    function saveCity(city) {
      localStorage.setItem("lastCity", city);
    }
    
    // Fetch weather data
    async function fetchWeather(city) {
      // Check if API key is set
      if (API_KEY === "YOUR_API_KEY_HERE") {
        showError("Please add your OpenWeatherMap API key in the code!");
        return;
      }
      
      // Show loading
      loading.classList.add("show");
      weatherCard.classList.remove("show");
      errorMessage.classList.remove("show");
      searchBtn.disabled = true;
      
      try {
        // Build API URL
        const url = `${API_URL}?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric`;
        
        // Fetch data
        const response = await fetch(url);
        
        // Check if request was successful
        if (!response.ok) {
          if (response.status === 404) {
            throw new Error("City not found. Please check the spelling.");
          } else if (response.status === 401) {
            throw new Error("Invalid API key. Please check your API key.");
          } else {
            throw new Error("Failed to fetch weather data.");
          }
        }
        
        // Parse JSON
        const data = await response.json();
        
        // Display weather
        displayWeather(data);
        
        // Save city
        saveCity(city);
        
      } catch (error) {
        showError(error.message);
      } finally {
        loading.classList.remove("show");
        searchBtn.disabled = false;
      }
    }
    
    // Display weather data
    function displayWeather(data) {
      // City name and country
      cityName.textContent = `${data.name}, ${data.sys.country}`;
      
      // Current date and time
      const now = new Date();
      dateTime.textContent = now.toLocaleDateString("en-US", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
      
      // Temperature
      temperature.textContent = Math.round(data.main.temp) + "°C";
      
      // Weather icon
      const iconCode = data.weather[0].icon;
      weatherIcon.textContent = weatherIcons[iconCode] || "🌤️";
      
      // Description
      description.textContent = data.weather[0].description;
      
      // Details
      humidity.textContent = data.main.humidity + "%";
      windSpeed.textContent = data.wind.speed + " m/s";
      feelsLike.textContent = Math.round(data.main.feels_like) + "°C";
      pressure.textContent = data.main.pressure + " hPa";
      
      // Show weather card
      weatherCard.classList.add("show");
    }
    
    // Show error message
    function showError(message) {
      errorMessage.textContent = "❌ " + message;
      errorMessage.classList.add("show");
      weatherCard.classList.remove("show");
    }
    
    // Search weather
    function searchWeather() {
      const city = cityInput.value.trim();
      
      if (city === "") {
        showError("Please enter a city name");
        return;
      }
      
      fetchWeather(city);
    }
    
    // Event listeners
    searchBtn.addEventListener("click", searchWeather);
    
    cityInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        searchWeather();
      }
    });
    
    // Initialize
    loadLastCity();
    
    // Auto-search if there's a saved city
    if (cityInput.value) {
      // Uncomment the line below to auto-search on page load
      // fetchWeather(cityInput.value);
    }
  </script>

</body>
</html>
