<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shopping Cart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f7fafc;
      min-height: 100vh;
      padding: 40px 20px;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    h1 {
      text-align: center;
      color: #2d3748;
      margin-bottom: 40px;
      font-size: 2.2rem;
    }
    
    .add-item-section {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .add-item-section h2 {
      color: #4a5568;
      margin-bottom: 20px;
      font-size: 1.2rem;
    }
    
    .input-group {
      display: grid;
      grid-template-columns: 2fr 1fr auto;
      gap: 12px;
    }
    
    input {
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    
    input:focus {
      border-color: #667eea;
    }
    
    button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    button:hover {
      background: #5a67d8;
      transform: translateY(-2px);
    }
    
    .cart-section {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid #e2e8f0;
    }
    
    .cart-header h2 {
      color: #4a5568;
      font-size: 1.2rem;
    }
    
    .item-count {
      background: #667eea;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    
    .cart-items {
      margin-bottom: 20px;
    }
    
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    
    .cart-item:hover {
      border-color: #cbd5e0;
      background: #f7fafc;
    }
    
    .item-info {
      flex: 1;
    }
    
    .item-name {
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 4px;
      font-size: 1.05rem;
    }
    
    .item-price {
      color: #48bb78;
      font-weight: 600;
      font-size: 1.1rem;
    }
    
    .remove-btn {
      background: #fc8181;
      padding: 8px 16px;
      font-size: 0.9rem;
    }
    
    .remove-btn:hover {
      background: #f56565;
    }
    
    .cart-total {
      background: #f7fafc;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .total-label {
      font-size: 1.2rem;
      font-weight: 600;
      color: #4a5568;
    }
    
    .total-amount {
      font-size: 2rem;
      font-weight: 700;
      color: #48bb78;
    }
    
    .empty-cart {
      text-align: center;
      padding: 60px 20px;
      color: #a0aec0;
    }
    
    .empty-cart-icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }
    
    .clear-cart-btn {
      background: #e53e3e;
      width: 100%;
      margin-top: 16px;
    }
    
    .clear-cart-btn:hover {
      background: #c53030;
    }
    
    @media (max-width: 600px) {
      .input-group {
        grid-template-columns: 1fr;
      }
      
      .cart-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      
      .remove-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🛒 Shopping Cart</h1>
    
    <!-- Add Item Section -->
    <div class="add-item-section">
      <h2>Add New Item</h2>
      <div class="input-group">
        <input 
          type="text" 
          id="itemName" 
          placeholder="Item name (e.g., Laptop)"
        />
        <input 
          type="number" 
          id="itemPrice" 
          placeholder="Price"
          min="0"
          step="0.01"
        />
        <button id="addBtn">Add to Cart</button>
      </div>
    </div>
    
    <!-- Cart Section -->
    <div class="cart-section">
      <div class="cart-header">
        <h2>Your Cart</h2>
        <span class="item-count" id="itemCount">0 items</span>
      </div>
      
      <div class="cart-items" id="cartItems">
        <div class="empty-cart">
          <div class="empty-cart-icon">🛍️</div>
          <p>Your cart is empty</p>
          <p style="font-size:0.9rem; margin-top:8px;">Add some items to get started!</p>
        </div>
      </div>
      
      <div class="cart-total" id="cartTotal" style="display:none;">
        <span class="total-label">Total:</span>
        <span class="total-amount" id="totalAmount">$0.00</span>
      </div>
      
      <button class="clear-cart-btn" id="clearBtn" style="display:none;">
        🗑️ Clear Cart
      </button>
    </div>
  </div>

  <script>
    // Cart state
    let cart = [];
    
    // DOM elements
    const itemNameInput = document.getElementById("itemName");
    const itemPriceInput = document.getElementById("itemPrice");
    const addBtn = document.getElementById("addBtn");
    const cartItems = document.getElementById("cartItems");
    const itemCount = document.getElementById("itemCount");
    const cartTotal = document.getElementById("cartTotal");
    const totalAmount = document.getElementById("totalAmount");
    const clearBtn = document.getElementById("clearBtn");
    
    // Load cart from localStorage
    function loadCart() {
      const saved = localStorage.getItem("shoppingCart");
      cart = saved ? JSON.parse(saved) : [];
      renderCart();
    }
    
    // Save cart to localStorage
    function saveCart() {
      localStorage.setItem("shoppingCart", JSON.stringify(cart));
    }
    
    // Add item to cart
    function addItem() {
      const name = itemNameInput.value.trim();
      const price = parseFloat(itemPriceInput.value);
      
      // Validation
      if (name === "") {
        alert("Please enter an item name");
        itemNameInput.focus();
        return;
      }
      
      if (isNaN(price) || price <= 0) {
        alert("Please enter a valid price");
        itemPriceInput.focus();
        return;
      }
      
      // Create item
      const item = {
        id: Date.now(),
        name: name,
        price: price
      };
      
      // Add to cart
      cart.push(item);
      saveCart();
      renderCart();
      
      // Clear inputs
      itemNameInput.value = "";
      itemPriceInput.value = "";
      itemNameInput.focus();
    }
    
    // Remove item from cart
    function removeItem(id) {
      cart = cart.filter(item => item.id !== id);
      saveCart();
      renderCart();
    }
    
    // Clear entire cart
    function clearCart() {
      if (confirm("Are you sure you want to clear your cart?")) {
        cart = [];
        saveCart();
        renderCart();
      }
    }
    
    // Calculate total
    function calculateTotal() {
      return cart.reduce((sum, item) => sum + item.price, 0);
    }
    
    // Render cart
    function renderCart() {
      // Update item count
      const count = cart.length;
      itemCount.textContent = count + (count === 1 ? " item" : " items");
      
      // Show/hide elements
      if (count === 0) {
        cartItems.innerHTML = `
          <div class="empty-cart">
            <div class="empty-cart-icon">🛍️</div>
            <p>Your cart is empty</p>
            <p style="font-size:0.9rem; margin-top:8px;">Add some items to get started!</p>
          </div>
        `;
        cartTotal.style.display = "none";
        clearBtn.style.display = "none";
      } else {
        // Render items
        cartItems.innerHTML = cart.map(item => `
          <div class="cart-item">
            <div class="item-info">
              <div class="item-name">${item.name}</div>
              <div class="item-price">$${item.price.toFixed(2)}</div>
            </div>
            <button class="remove-btn" onclick="removeItem(${item.id})">
              Remove
            </button>
          </div>
        `).join("");
        
        // Show total
        cartTotal.style.display = "flex";
        clearBtn.style.display = "block";
        
        // Update total amount
        const total = calculateTotal();
        totalAmount.textContent = "$" + total.toFixed(2);
      }
    }
    
    // Event listeners
    addBtn.addEventListener("click", addItem);
    
    itemNameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        itemPriceInput.focus();
      }
    });
    
    itemPriceInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        addItem();
      }
    });
    
    clearBtn.addEventListener("click", clearCart);
    
    // Initialize
    loadCart();
  </script>

</body>
</html>
